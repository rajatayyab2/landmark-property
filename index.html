<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LandMark Property - Zameen map par dekhein aur khareedein</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--teal:#0F4C5C;--amber:#F2A900;--ink:#14212A;--paper:#F4F7F8;--line:#D3DCE0;--red:#B3261E}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink)}
#map{position:fixed;inset:0}
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:rgba(15,76,92,.95);color:#fff}
.logo{font-size:19px;font-weight:800;margin:0;flex:1;min-width:150px;letter-spacing:.2px}
.logo span{color:var(--amber)}
#who{font-size:13px;opacity:.85;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;background:var(--amber);color:var(--ink);font-weight:700}
button.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.search{flex-basis:100%;display:flex;gap:6px}
.search input,.search select{flex:1;min-width:0;padding:8px;border-radius:6px;border:0;font:inherit}
.hint{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:5;background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;display:none;font-size:14px;text-align:center;width:max-content;max-width:92vw}
.count{position:fixed;left:10px;bottom:24px;z-index:5;background:#fff;padding:6px 10px;border-radius:6px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;z-index:10;background:rgba(20,33,42,.6);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.card{background:#fff;border-radius:10px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.card h2{margin:0 0 8px;font-size:20px}
label{display:block;font-size:14px;margin:10px 0 4px}
.card input,.card textarea,.card select{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:6px}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1}
.row .cancel{background:var(--paper);color:var(--ink)}
.err{color:var(--red);font-size:14px;min-height:18px;margin-top:6px}
.setup{position:fixed;inset:0;z-index:20;background:#fff;padding:24px;display:none;font-size:15px;line-height:1.5}
.iw{max-width:250px;font-size:14px;line-height:1.4}
.iw img{width:100%;max-height:130px;object-fit:cover;border-radius:6px;margin-bottom:6px}
.iw h3{margin:0 0 2px;font-size:16px}
.iw .price{font-weight:800;color:var(--teal);margin-bottom:4px}
.iw .tag{display:inline-block;font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-bottom:4px}
.iw .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.iw a,.iw button{padding:7px 11px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:700;background:var(--teal);color:#fff;border:0;cursor:pointer}
.iw .wa{background:#1B8A4B}.iw .del{background:var(--red)}.iw .sold{background:#555}
</style>
</head>
<body>
<div id="map"></div>

<div class="bar">
  <h1 class="logo">LandMark <span>Property</span></h1>
  <span id="who"></span>
  <button id="addBtn">Property bechein</button>
  <button id="authBtn" class="ghost">Login</button>
  <div class="search">
    <input id="q" type="search" placeholder="Title ya area search karein" aria-label="Search">
    <select id="typeF" aria-label="Type">
      <option value="">Sab types</option><option>Plot</option><option>House</option><option>Flat</option><option>Commercial</option><option>Agricultural</option>
    </select>
  </div>
</div>
<div class="hint" id="hint">Map par jahan property hai wahan click karein</div>
<div class="count" id="count"></div>

<div class="setup" id="setup"><h2>Setup baqi hai</h2>
<p>File ke <b>CONFIG</b> section mein apni Firebase aur Google Maps keys lagayein, phir file ko hosting (ya <code>localhost</code>) se kholein.</p></div>

<div class="modal" id="authModal"><div class="card">
  <h2 id="authTitle">Login</h2>
  <label for="em">Email</label><input id="em" type="email" autocomplete="email">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="authErr"></div>
  <div class="row"><button id="authGo">Login</button><button class="cancel" id="authX">Band karein</button></div>
  <p style="font-size:14px;margin:12px 0 0"><a href="#" id="swap">Naya account banayein</a></p>
</div></div>

<div class="modal" id="propModal"><div class="card">
  <h2>Property ki details</h2>
  <label for="pt">Title</label><input id="pt" placeholder="10 marla plot, DHA Phase 6">
  <label for="ptype">Type</label>
  <select id="ptype"><option>Plot</option><option>House</option><option>Flat</option><option>Commercial</option><option>Agricultural</option></select>
  <label for="pp">Price (PKR)</label><input id="pp" inputmode="numeric" placeholder="12500000">
  <label for="pd">Description</label><textarea id="pd" rows="3"></textarea>
  <label for="ph">Contact number</label><input id="ph" type="tel" placeholder="03001234567">
  <label for="pimg">Photo (optional, max 5MB)</label><input id="pimg" type="file" accept="image/*">
  <div class="err" id="propErr"></div>
  <div class="row"><button id="propSave">Save karein</button><button class="cancel" id="propX">Band karein</button></div>
</div></div>

<!-- ================= CONFIG: apni keys yahan lagayein ================= -->
<script>
window.CONFIG={
  firebase:{
    apiKey:"AIzaSyCC_JpfWWgsGkENCPs5Jc-Gq9K81tOCO98",
    authDomain:"landmark-land.firebaseapp.com",
    projectId:"landmark-land",
    storageBucket:"landmark-land.firebasestorage.app",
    appId:"1:533684184155:web:87561c626e269b82534b7e"
  },
  center:{lat:31.5204,lng:74.3587}, zoom:12
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,onSnapshot,deleteDoc,doc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(CONFIG.firebase.apiKey.startsWith("YOUR_")){ $('setup').style.display='block'; throw new Error("Config missing"); }

const app=initializeApp(CONFIG.firebase), auth=getAuth(app), db=getFirestore(app), store=getStorage(app);
const sat=L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri'}),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})
]);
const streets=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'});
const map=L.map('map',{center:[CONFIG.center.lat,CONFIG.center.lng],zoom:CONFIG.zoom,layers:[sat],zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);
L.control.layers({'Satellite':sat,'Streets':streets},null,{position:'bottomright'}).addTo(map);
let me=null, listings=[], markers=[], picking=false, pending=null, signup=false;

/* ---------- Realtime listings (sab users ko nazar ayengi) ---------- */
onSnapshot(collection(db,"listings"),snap=>{
  listings=snap.docs.map(d=>({id:d.id,...d.data()}));
  draw();
},err=>{$('count').textContent="Properties load nahi hui: "+err.code});

function filtered(){
  const q=$('q').value.trim().toLowerCase(), t=$('typeF').value;
  return listings.filter(l=>(!t||l.type===t)&&(!q||(l.title+" "+l.desc).toLowerCase().includes(q)));
}
function draw(){
  markers.forEach(m=>m.remove()); markers=[];
  const list=filtered();
  list.forEach(l=>{
    const sold=l.status==="sold";
    const m=L.circleMarker([l.lat,l.lng],{radius:11,fillColor:sold?'#888':'#F2A900',fillOpacity:1,color:'#14212A',weight:2}).addTo(map);
    m.on('click',()=>open(l));
    markers.push(m);
  });
  $('count').textContent=list.length+" properties";
}
function open(l){
  const tel=String(l.phone||"").replace(/\D/g,"");
  const wa=tel.startsWith("0")?"92"+tel.slice(1):tel;
  const own=me&&me.uid===l.owner, sold=l.status==="sold";
  const div=document.createElement('div'); div.className='iw';
  div.innerHTML=`${l.photo?`<img src="${esc(l.photo)}" alt="">`:""}
    <h3>${esc(l.title)}</h3><span class="tag">${esc(l.type)}${sold?" - SOLD":""}</span>
    <div class="price">PKR ${Number(l.price).toLocaleString()}</div><div>${esc(l.desc)}</div>
    <div class="acts"><a href="tel:${esc(tel)}">Call</a><a class="wa" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a></div>`;
  if(own){
    const a=div.querySelector('.acts');
    const s=document.createElement('button'); s.className='sold'; s.textContent=sold?"Dobara for sale":"Sold karein";
    s.onclick=async()=>{await updateDoc(doc(db,"listings",l.id),{status:sold?"sale":"sold"});map.closePopup()};
    const d=document.createElement('button'); d.className='del'; d.textContent="Delete";
    d.onclick=async()=>{if(confirm("Yeh property delete karein?")){await deleteDoc(doc(db,"listings",l.id));map.closePopup()}};
    a.append(s,d);
  }
  L.popup({maxWidth:260}).setLatLng([l.lat,l.lng]).setContent(div).openOn(map);
}
$('q').oninput=draw; $('typeF').onchange=draw;

/* ---------- Auth ---------- */
onAuthStateChanged(auth,u=>{me=u;$('who').textContent=u?u.email:"";$('authBtn').textContent=u?"Logout":"Login"; draw()});
function setMode(s){signup=s;$('authTitle').textContent=s?"Naya account":"Login";$('authGo').textContent=s?"Account banayein":"Login";$('swap').textContent=s?"Pehle se account hai? Login":"Naya account banayein"}
function openAuth(){$('authErr').textContent="";$('authModal').classList.add('on');$('em').focus()}
$('swap').onclick=e=>{e.preventDefault();setMode(!signup)};
$('authX').onclick=()=>$('authModal').classList.remove('on');
$('authBtn').onclick=()=>{ if(me){signOut(auth)} else {setMode(false);openAuth()} };
const authMsg={"auth/invalid-credential":"Email ya password ghalat hai.","auth/email-already-in-use":"Yeh email pehle se registered hai.","auth/weak-password":"Password kam az kam 6 harf ka rakhein.","auth/invalid-email":"Email sahi nahi hai."};
$('authGo').onclick=async()=>{
  const em=$('em').value.trim(), pw=$('pw').value;
  $('authGo').disabled=true;
  try{
    await (signup?createUserWithEmailAndPassword(auth,em,pw):signInWithEmailAndPassword(auth,em,pw));
    $('authModal').classList.remove('on'); $('pw').value="";
  }catch(e){$('authErr').textContent=authMsg[e.code]||"Masla aya: "+e.code}
  $('authGo').disabled=false;
};

/* ---------- Property add ---------- */
$('addBtn').onclick=()=>{ if(!me){setMode(false);openAuth();return} picking=true; $('hint').style.display='block'; };
map.on('click',e=>{
  if(!picking)return;
  picking=false; $('hint').style.display='none';
  pending={lat:e.latlng.lat,lng:e.latlng.lng};
  $('propModal').classList.add('on');
});
$('propX').onclick=()=>$('propModal').classList.remove('on');
$('propSave').onclick=async()=>{
  const t=$('pt').value.trim(),p=$('pp').value.trim(),h=$('ph').value.trim(),f=$('pimg').files[0];
  if(!t||!/^\d+$/.test(p)||h.replace(/\D/g,"").length<10){$('propErr').textContent="Title, price (sirf number) aur sahi phone number zaroori hain.";return}
  if(f&&(!f.type.startsWith("image/")||f.size>5*1024*1024)){$('propErr').textContent="Photo image ho aur 5MB se chhoti ho.";return}
  $('propSave').disabled=true; $('propErr').textContent="";
  try{
    let photo="";
    if(f){ const r=ref(store,`listings/${me.uid}/${Date.now()}-${f.name.replace(/[^\w.]/g,"_")}`); await uploadBytes(r,f); photo=await getDownloadURL(r); }
    await addDoc(collection(db,"listings"),{owner:me.uid,title:t,type:$('ptype').value,price:Number(p),desc:$('pd').value.trim(),phone:h,photo,status:"sale",created:serverTimestamp(),...pending});
    ["pt","pp","pd","ph","pimg"].forEach(i=>$(i).value=""); $('propModal').classList.remove('on');
  }catch(e){$('propErr').textContent="Save nahi hua: "+(e.code||e.message)}
  $('propSave').disabled=false;
};
</script>
</body>
</html>
